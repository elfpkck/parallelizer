[dependency-groups]
dev = [
  "pydevd-pycharm",
  "ruff>=0.15.20"
]

[project]
authors = [{name = "Andrii Liekariev", email = "elfpkck@gmail.com"}]
dependencies = [
  "pre-commit==4.3.0",
  "pytest-cov==7.1.0",
  "pytest-qgis==2.1.0"
]
description = ""
license = "GPL-2.0-or-later"
name = "parallelizer"
readme = "README.md"
requires-python = ">=3.9"
version = "0.0.0"

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING"
]

[tool.coverage.run]
branch = true

[tool.mypy]
disallow_untyped_defs = true
exclude = ['.*/plugin.py', '.*/provider.py', '.*/test.*', 'PolygonsParallelToLine/__init__.py']
explicit_package_bases = true
follow_imports = "silent"
ignore_missing_imports = false
namespace_packages = true
warn_return_any = true

[tool.pytest.ini_options]
addopts = "-m 'not perf'"
markers = ["perf: performance smoke tests (skipped by default; run with `-m perf`)"]

[tool.qgis-plugin-ci]
github_organization_slug = "elfpkck"
plugin_path = "PolygonsParallelToLine"
project_slug = "parallelizer"

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
ignore = [
  "ANN204",
  "COM812",
  "D100",
  "D101",
  "D102",
  "D103",
  "D104",
  "D107",
  "D205",
  "D212",
  "D401",
  "INP001",
  "N999",
  "RET503"
]
select = ["ALL"]

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true

[tool.ruff.lint.per-file-ignores]
"PolygonsParallelToLine/__init__.py" = ["ANN001", "ARG001", "N802", "PLC0415"]
"algorithm.py" = ["ARG002", "I001"]
"azimuth.py" = ["PLR2004"]
"map_tool.py" = ["ANN001", "N802"]
"plugin.py" = ["FBT001", "I001", "N802", "PLC0415"]
"provider.py" = ["N802"]
"tests/*" = ["ANN001", "ANN201", "ARG001", "D413", "E501", "FBT001", "PLR0913", "PLR2004", "PT003", "PT006", "S101"]
