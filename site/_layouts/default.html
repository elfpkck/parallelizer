<!doctype html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="utf-8">

{% seo %}
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    <link rel="icon" type="image/png" href="{{ '/assets/favicon.png' | relative_url }}">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% include head-custom.html %}
  </head>
  <body>
      <div id="header">
        <nav>
          <ul>
            <li class="fork"><a href="{{ site.github.repository_url }}">View On GitHub</a></li>
          </ul>
        </nav>
      </div><!-- end header -->

    <div class="wrapper">

      <section>
        {{ content | replace: '<img ', '<img loading="lazy" ' | replace_first: '<img loading="lazy" ', '<img fetchpriority="high" ' }}

        <footer id="credits">
          <hr>
          <span class="credits left">Project maintained by <a href="{{ site.github.owner_url }}">{{ site.github.owner_name }}</a></span>
          <span class="credits right">Hosted on GitHub Pages, theme by <a href="https://twitter.com/mattgraham">mattgraham</a></span>
        </footer>
      </section>

    </div>
  </body>
</html>
