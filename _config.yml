theme: jekyll-theme-midnight
title: Parallelizer
description: QGIS plugin to align polygons and lines parallel to the nearest road, line or polygon edge. Rotate building footprints to streets or parcels, in batch or interactively. By Andrii Liekariev.
author: Andrii Liekariev
# Jekyll 3 replaces its default excludes with this list, so the defaults are repeated here.
exclude:
- CLAUDE.md
- CLAUDE.local.md
- Gemfile
- Gemfile.lock
- node_modules
- vendor/bundle/
- vendor/cache/
- vendor/gems/
- vendor/ruby/
